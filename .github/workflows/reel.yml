# Le Lobby — montage d'un reel dans le cloud (aucun ordi requis).
# Claude dépose jobs/<post>.json + le fond PNG ; ce workflow télécharge le clip,
# pose le fond (titre, logo, crédit) avec ffmpeg et commit le MP4 dans posts/<post>/.
name: reel
on:
  push:
    paths: ["jobs/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: reel, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq >/dev/null
      - name: Monter les reels en attente
        run: |
          set -euo pipefail
          for job in jobs/*.json; do
            [ -e "$job" ] || continue
            post=$(jq -r .post "$job"); url=$(jq -r .video_url "$job"); ov=$(jq -r .overlay "$job"); vy=$(jq -r '.video_y // 730' "$job")
            out="posts/$post/$post.mp4"
            if [ -f "$out" ]; then echo "déjà fait : $out"; continue; fi
            mkdir -p "posts/$post"
            curl -sSfL --retry 3 -A "Mozilla/5.0" -o /tmp/clip.mp4 "$url"
            bash scripts/compose.sh "$ov" /tmp/clip.mp4 "$out" "$vy"
            ffmpeg -y -loglevel error -ss 2 -i "$out" -frames:v 1 "posts/$post/${post}_cover.jpg"
            git rm -q "$job"
          done
      - name: Commit
        run: |
          git config user.name "lelobby-bot"; git config user.email "lelobbyactu@gmail.com"
          git add -A posts jobs
          git diff --cached --quiet || (git commit -qm "reel monté" && git push)
