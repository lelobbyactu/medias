# Le Lobby — installe le Worker Cloudflare et relie le bot Telegram. Aucune clé dans le dépôt : tout vient des secrets.
name: deploy-worker
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: deploy-worker, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/
            /state/
            /worker/
            /config.json
          sparse-checkout-cone-mode: false
      - name: Vérifier les secrets et les accès
        run: |
          manque=0
          for v in TELEGRAM_BOT_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GH_DISPATCH_TOKEN ZERNIO_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::secret manquant : $v"; manque=1; fi
          done
          [ $manque -eq 0 ]
          ko=0
          ok() { echo "$1 : $2"; [ "$2" = 200 ] || { echo "::error::$1 refusé (code $2)"; ko=1; }; }
          [[ "$TELEGRAM_BOT_TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]{30,}$ ]] || echo "::error::TELEGRAM_BOT_TOKEN n'a pas la forme « chiffres:lettres » donnée par BotFather (espace, ligne en trop ou valeur tronquée ?)"
          ok "Telegram" "$(curl -s -o /dev/null -w '%{http_code}' "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getMe")"
          ok "Zernio" "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ZERNIO_API_KEY" https://zernio.com/api/v1/accounts)"
          ok "Jeton GitHub (Actions)" "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_DISPATCH_TOKEN" -H 'User-Agent: lelobby' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows")"
          ok "Cloudflare" "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          [ $ko -eq 0 ]
      - name: Préparer le stockage et l'adresse
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          cf() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$@"; }
          kv=$(cf "$API/storage/kv/namespaces?per_page=100" | jq -r '.result[]? | select(.title=="lelobby-validation") | .id')
          if [ -z "$kv" ]; then kv=$(cf -X POST "$API/storage/kv/namespaces" --data '{"title":"lelobby-validation"}' | jq -r '.result.id // empty'); fi
          [ -n "$kv" ] || { echo "::error::stockage KV non créé"; exit 1; }
          sub=$(cf "$API/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            for s in lelobbyactu lelobby-actu "lelobby-$RANDOM"; do
              sub=$(cf -X PUT "$API/workers/subdomain" --data "{\"subdomain\":\"$s\"}" | jq -r '.result.subdomain // empty')
              [ -n "$sub" ] && break
            done
          fi
          [ -n "$sub" ] || { echo "::error::adresse workers.dev non créée (vérifier l'e-mail du compte Cloudflare)"; exit 1; }
          echo "WORKER_URL=https://lelobby-validation.$sub.workers.dev" >> "$GITHUB_ENV"
          cat > worker/wrangler.toml <<TOML
          name = "lelobby-validation"
          main = "index.js"
          compatibility_date = "2026-11-01"
          workers_dev = true
          kv_namespaces = [ { binding = "KV", id = "$kv" } ]
          [triggers]
          crons = ["0 * * * *"]
          TOML
      - name: Déployer
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config worker/wrangler.toml
          for v in TELEGRAM_BOT_TOKEN GH_DISPATCH_TOKEN; do
            printf '%s' "${!v}" | npx --yes wrangler@4 secret put "$v" --config worker/wrangler.toml
          done
      - name: Relier le bot et noter l'adresse
        run: |
          set -euo pipefail
          hook=$(printf '%s' "$TELEGRAM_BOT_TOKEN:webhook" | sha256sum | cut -d' ' -f1)
          sleep 20
          curl -sS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" \
            --form-string "url=$WORKER_URL/telegram" --form-string "secret_token=$hook" \
            --form-string 'allowed_updates=["message","callback_query"]' | jq -e '.ok' >/dev/null
          jq -n --arg u "$WORKER_URL" '{url: $u}' > state/worker.json
          git config user.name "lelobby-bot"; git config user.email "lelobbyactu@gmail.com"
          git add state/worker.json
          git diff --cached --quiet && exit 0
          git commit -qm "worker: adresse"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 5)); done
          exit 1
